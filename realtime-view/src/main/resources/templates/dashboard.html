<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMALL 实时数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/map/js/china.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0a0e27;
            --card-bg-color: rgba(16, 22, 58, 0.6);
            --border-color: #1e3a8a;
            --title-color: #00d4ff;
            --kpi-color: #00ff88;
            --text-color: #e0e6ed;
            --accent-color: #ff6b6b;
            --secondary-color: #4ecdc4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
        }

        .container-fluid {
            padding: 1.5rem;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            padding: 2rem 1rem;
            background: linear-gradient(90deg, transparent 0%, rgba(0, 212, 255, 0.1) 50%, transparent 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            border-radius: 12px;
            z-index: -1;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--title-color);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            letter-spacing: 2px;
            position: relative;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--title-color), transparent);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(120px, auto);
            gap: 1.5rem;
        }

        .card-panel {
            background: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--title-color), var(--secondary-color), var(--accent-color));
            border-radius: 16px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card-panel:hover::before {
            opacity: 0.3;
        }

        .card-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--title-color);
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-align: center;
            position: relative;
        }

        .card-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--title-color), transparent);
        }

        /* KPI Cards */
        .kpi-card {
            text-align: center;
            grid-column: span 2;
            position: relative;
        }

        .kpi-label {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 1rem;
            font-weight: 400;
            opacity: 0.8;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--kpi-color);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            margin-top: 0.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
            50% { text-shadow: 0 0 25px rgba(0, 255, 136, 0.8); }
            100% { text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
        }

        /* Map Card */
        .map-card {
            grid-column: 1 / 8;
            grid-row: 2 / 5;
        }

        .map-placeholder {
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Other Chart Cards */
        .chart-card-1 {
            grid-column: 8 / 11;
            grid-row: 2 / 4;
        }

        .chart-card-2 {
            grid-column: 11 / 13;
            grid-row: 2 / 4;
        }

        .chart-card-3 {
            grid-column: 8 / 13;
            grid-row: 4 / 5;
        }

        .chart-placeholder {
            height: 280px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Bottom charts */
        .bottom-chart-1 {
            grid-column: 1 / 7;
            grid-row: 5 / 6;
        }

        .bottom-chart-2 {
            grid-column: 7 / 13;
            grid-row: 5 / 6;
        }

        .sku-table-container {
            height: 280px;
            overflow-y: auto;
        }

        .sku-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sku-table th, .sku-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .sku-table th {
            color: var(--title-color);
            font-weight: 700;
            position: sticky;
            top: 0;
            background: var(--card-bg-color);
        }

        .sku-table tr:hover {
            background-color: rgba(0, 212, 255, 0.1);
        }

        .sku-table .rank {
            color: var(--accent-color);
            font-weight: 900;
            width: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="header">
            <h1>GMALL 实时数据大屏</h1>
        </div>
        <div class="grid-container">
            <!-- KPIs -->
            <div class="card-panel kpi-card"><div class="kpi-label">总用户数</div><div class="kpi-value" id="totalUsers">-</div></div>
            <div class="card-panel kpi-card"><div class="kpi-label">总订单数</div><div class="kpi-value" id="totalOrders">-</div></div>
            <div class="card-panel kpi-card"><div class="kpi-label">总交易额(万)</div><div class="kpi-value" id="totalAmount">-</div></div>
            <div class="card-panel kpi-card"><div class="kpi-label">总支付数</div><div class="kpi-value" id="totalPayments">-</div></div>
            <div class="card-panel kpi-card"><div class="kpi-label">总加购数</div><div class="kpi-value" id="totalCartAdds">-</div></div>
            <div class="card-panel kpi-card"><div class="kpi-label">总访问量(PV)</div><div class="kpi-value" id="totalPV">-</div></div>

            <!-- Map -->
            <div class="card-panel map-card"><div class="card-title">各省份订单分布</div><div id="mapChart" class="map-placeholder"></div></div>

            <!-- Right side charts -->
            <div class="card-panel chart-card-1"><div class="card-title">支付成功率</div><div id="paymentRateChart" class="chart-placeholder"></div></div>
            <div class="card-panel chart-card-2"><div class="card-title">新老访客分布</div><div id="visitorDistributionChart" class="chart-placeholder"></div></div>
            <div class="card-panel chart-card-3"><div class="card-title">热搜关键词</div><div id="keywordCloudChart" class="chart-placeholder"></div></div>
            
            <!-- Bottom charts -->
            <div class="card-panel bottom-chart-1"><div class="card-title">渠道来源分布</div><div id="channelDistributionChart" class="chart-placeholder"></div></div>
            <div class="card-panel bottom-chart-2">
                <div class="card-title">热销商品 TOP 5</div>
                <div class="sku-table-container">
                    <table class="sku-table">
                        <thead>
                            <tr>
                                <th class="rank">排名</th>
                                <th>商品名称</th>
                                <th>订单金额(万)</th>
                            </tr>
                        </thead>
                        <tbody id="topSkuTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="none">
        const API_BASE_URL = '/api';
        let instances; // Declare instances in a broader scope

        // Formatters
        const formatNumber = num => num ? num.toLocaleString() : '-';
        const formatAmount = num => num ? (num / 10000).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';

        // API fetch functions
        const fetchData = async (url, chartName) => {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    console.error(`Failed to fetch data for ${chartName}: HTTP ${response.status}`);
                    return null;
                }
                const data = await response.json();
                console.log(`Successfully fetched data for ${chartName}:`, data);
                return data;
            } catch (error) {
                console.error(`Error fetching from ${url} for ${chartName}:`, error);
                return null;
            }
        };

        // Enhanced chart configurations
        const chartTheme = {
            backgroundColor: 'transparent',
            textStyle: { color: '#e0e6ed' },
            title: { textStyle: { color: '#00d4ff', fontSize: 16, fontWeight: 'bold' } },
            legend: { textStyle: { color: '#e0e6ed', fontSize: 12 } },
            tooltip: {
                backgroundColor: 'rgba(16, 22, 58, 0.9)',
                borderColor: '#00d4ff',
                borderWidth: 1,
                textStyle: { color: '#e0e6ed' }
            }
        };

        // Render functions - now accept instances as an argument where needed
        async function updateOverallData() {
            const data = await fetchData(`${API_BASE_URL}/dashboard/overall`, 'Overall KPIs');
            if (!data) return;
            document.getElementById('totalUsers').textContent = formatNumber(data.totalUsers);
            document.getElementById('totalOrders').textContent = formatNumber(data.totalOrders);
            document.getElementById('totalAmount').textContent = formatAmount(data.totalAmount);
            document.getElementById('totalPayments').textContent = formatNumber(data.totalPayments);
            document.getElementById('totalCartAdds').textContent = formatNumber(data.totalCartAdds);
            document.getElementById('totalPV').textContent = formatNumber(data.totalPV);
        }

        async function renderMap(instances) {
            const data = await fetchData(`${API_BASE_URL}/dashboard/map`, 'Map');
            if (!data) return;
            const maxValue = Math.max(...data.map(item => item.value)) || 1;
            const option = {
                ...chartTheme,
                tooltip: { 
                    trigger: 'item', 
                    formatter: '{b}<br/>订单数: {c}',
                    backgroundColor: 'rgba(16, 22, 58, 0.9)',
                    borderColor: '#00d4ff',
                    textStyle: { color: '#e0e6ed' }
                },
                visualMap: { 
                    min: 0, 
                    max: maxValue, 
                    left: 'left', 
                    top: 'bottom',
                    text: ['高', '低'], 
                    calculable: true,
                    inRange: { 
                        color: ['#003366', '#0066cc', '#00ccff', '#00ffcc', '#66ff66'] 
                    },
                    textStyle: { color: '#e0e6ed' },
                    itemWidth: 20,
                    itemHeight: 200
                },
                series: [{
                    name: '订单数',
                    type: 'map',
                    map: 'china',
                    roam: true,
                    zoom: 1.2,
                    label: {
                        show: true,
                        color: '#e0e6ed',
                        fontSize: 10
                    },
                    itemStyle: {
                        borderColor: '#00d4ff',
                        borderWidth: 1,
                        areaColor: 'rgba(0, 100, 200, 0.3)'
                    },
                    emphasis: {
                        label: { color: '#00ff88', fontSize: 12 },
                        itemStyle: { areaColor: 'rgba(0, 255, 136, 0.5)' }
                    },
                    data: data
                }]
            };
            instances.map.setOption(option);
        }

        async function renderTopSkuTable() {
            const data = await fetchData(`${API_BASE_URL}/charts/topN?tableName=dws_trade_sku_order_window&groupBy=sku_name&aggField=order_amount&aggFunc=SUM&topN=5`, 'Top SKU');
            if (!data) return;
            const tableBody = document.getElementById('topSkuTableBody');
            tableBody.innerHTML = data.map((item, index) => `
                <tr>
                    <td class="rank">${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${formatAmount(item.value)}</td>
                </tr>
            `).join('');
        }

        async function renderChannelDistributionChart(instances) {
            const data = await fetchData(`${API_BASE_URL}/charts/distribution?tableName=dws_traffic_vc_ch_ar_is_new_page_view_window&groupBy=ch&valueField=pv_ct`, 'Channel Distribution');
            if (!data) return;
            const option = {
                ...chartTheme,
                tooltip: { 
                    trigger: 'item', 
                    formatter: '{b}: {c} ({d}%)',
                    backgroundColor: 'rgba(16, 22, 58, 0.9)'
                },
                legend: { 
                    orient: 'vertical', 
                    left: 'left', 
                    textStyle: { 
                        color: '#e0e6ed', 
                        fontSize: 11 
                    },
                    itemWidth: 12,
                    itemHeight: 12
                },
                series: [{
                    name: '渠道来源',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['60%', '50%'],
                    avoidLabelOverlap: true,
                    label: {
                        show: true,
                        color: '#e0e6ed',
                        fontSize: 10,
                        formatter: '{b}\n{c}人\n{d}%'
                    },
                    emphasis: { 
                        label: { 
                            show: true, 
                            fontSize: 12, 
                            fontWeight: 'bold',
                            color: '#00ff88'
                        },
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    },
                    itemStyle: {
                        borderRadius: 5,
                        borderColor: '#0a0e27',
                        borderWidth: 2
                    },
                    data: data.map((item, index) => ({
                        ...item,
                        itemStyle: {
                            color: [
                                '#00d4ff', '#00ff88', '#ff6b6b', '#4ecdc4', 
                                '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd'
                            ][index % 8]
                        }
                    }))
                }]
            };
            instances.channel.setOption(option);
        }

        async function renderPaymentRateChart(instances) {
            const data = await fetchData(`${API_BASE_URL}/dashboard/payment-success-rate`, 'Payment Rate');
            if (!data) return;
            const rate = data.rate.toFixed(2);
            const option = {
                ...chartTheme,
                series: [{
                    type: 'gauge',
                    startAngle: 180,
                    endAngle: 0,
                    min: 0,
                    max: 100,
                    splitNumber: 10,
                    radius: '80%',
                    center: ['50%', '70%'],
                    axisLine: {
                        lineStyle: {
                            width: 20,
                            color: [
                                [0.3, '#ff6b6b'],
                                [0.7, '#f39c12'],
                                [1, '#00ff88']
                            ]
                        }
                    },
                    pointer: {
                        itemStyle: {
                            color: '#00d4ff',
                            shadowColor: 'rgba(0, 212, 255, 0.5)',
                            shadowBlur: 10
                        }
                    },
                    axisTick: {
                        length: 12,
                        lineStyle: {
                            color: 'auto',
                            width: 2
                        }
                    },
                    splitLine: {
                        length: 20,
                        lineStyle: {
                            color: 'auto',
                            width: 3
                        }
                    },
                    axisLabel: {
                        color: '#e0e6ed',
                        fontSize: 10,
                        distance: -50,
                        formatter: '{value}%'
                    },
                    title: {
                        offsetCenter: [0, '-20%'],
                        fontSize: 14,
                        color: '#00d4ff'
                    },
                    detail: {
                        fontSize: 24,
                        offsetCenter: [0, '10%'],
                        valueAnimation: true,
                        formatter: '{value}%',
                        color: rate > 80 ? '#00ff88' : rate > 60 ? '#f39c12' : '#ff6b6b',
                        fontWeight: 'bold'
                    },
                    data: [{
                        value: rate,
                        name: '支付成功率'
                    }]
                }]
            };
            instances.paymentRate.setOption(option);
        }

        async function renderVisitorDistributionChart(instances) {
            const data = await fetchData(`${API_BASE_URL}/charts/distribution?tableName=dws_traffic_vc_ch_ar_is_new_page_view_window&groupBy=is_new&valueField=uv_ct`, 'Visitor Distribution');
            if (!data) return;
            const option = {
                ...chartTheme,
                tooltip: { 
                    trigger: 'item', 
                    formatter: '{b}: {c} ({d}%)',
                    backgroundColor: 'rgba(16, 22, 58, 0.9)'
                },
                series: [{
                    name: '访客类型',
                    type: 'pie',
                    radius: ['50%', '80%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: true,
                    label: {
                        show: true,
                        color: '#e0e6ed',
                        fontSize: 12,
                        formatter: '{b}\n{c}人\n{d}%'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 14,
                            fontWeight: 'bold',
                            color: '#00ff88'
                        },
                        itemStyle: {
                            shadowBlur: 15,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.8)'
                        }
                    },
                    itemStyle: {
                        borderRadius: 8,
                        borderColor: '#0a0e27',
                        borderWidth: 3
                    },
                    data: data.map(item => ({
                        name: item.name === '1' ? '新访客' : '老访客',
                        value: item.value,
                        itemStyle: {
                            color: item.name === '1' ? '#00ff88' : '#00d4ff'
                        }
                    }))
                }]
            };
            instances.visitor.setOption(option);
        }
        
        async function renderKeywordCloudChart(instances) {
            const data = await fetchData(`${API_BASE_URL}/charts/topN?tableName=dws_traffic_source_keyword_page_view_window&groupBy=keyword&aggField=keyword_count&aggFunc=SUM&topN=30`, 'Keyword Cloud');
            if (!data) return;
            const option = {
                ...chartTheme,
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    left: 'center', top: 'center',
                    width: '100%', height: '100%',
                    right: null, bottom: null,
                    sizeRange: [14, 50],
                    rotationRange: [-45, 45],
                    rotationStep: 15,
                    gridSize: 8,
                    drawOutOfBound: true, // Allow words to be drawn outside the container
                    layoutAnimation: true,
                    textStyle: {
                        fontFamily: 'Orbitron, sans-serif',
                        fontWeight: 'bold',
                        color: function () {
                            const colors = ['#00d4ff', '#00ff88', '#ff6b6b', '#4ecdc4', '#ffeaa7', '#dda0dd'];
                            return colors[Math.floor(Math.random() * colors.length)];
                        }
                    },
                    emphasis: { textStyle: { shadowBlur: 10, shadowColor: '#00d4ff', color: '#ffffff' } },
                    data: data
                }]
            };
            instances.keywordCloud.setOption(option);
        }

        // Initial load and scheduled refresh
        function initDashboard(instances) { // Accept instances as argument
            console.log("Initializing dashboard data fetch...");
            
            // Call render functions passing instances where needed
            updateOverallData();
            renderMap(instances);
            renderTopSkuTable();
            renderChannelDistributionChart(instances);
            renderPaymentRateChart(instances);
            renderVisitorDistributionChart(instances);
            renderKeywordCloudChart(instances);

            setInterval(() => {
                updateOverallData();
                renderMap(instances);
                renderTopSkuTable();
                renderChannelDistributionChart(instances);
                renderPaymentRateChart(instances);
                renderVisitorDistributionChart(instances);
                renderKeywordCloudChart(instances);
            }, 30000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Declare and initialize instances here, after DOM is ready
            instances = {
                map: echarts.init(document.getElementById('mapChart')),
                channel: echarts.init(document.getElementById('channelDistributionChart')),
                paymentRate: echarts.init(document.getElementById('paymentRateChart')),
                visitor: echarts.init(document.getElementById('visitorDistributionChart')),
                keywordCloud: echarts.init(document.getElementById('keywordCloudChart'))
            };

            initDashboard(instances); // Pass instances to initDashboard

            window.addEventListener('resize', () => {
                for (const key in instances) {
                    if (instances.hasOwnProperty(key) && instances[key] && typeof instances[key].resize === 'function') {
                        instances[key].resize();
                    }
                }
            });
        });
    </script>
</body>
</html>
