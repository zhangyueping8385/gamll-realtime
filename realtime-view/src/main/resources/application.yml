spring:
  application:
    name: realtime-view
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

# Doris配置
server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    connection-timeout: 30000

doris:
  fenodes: ${DORIS_FENODES:bigdata1:9030}
  database: ${DORIS_DATABASE:gmall_realtime}
  username: ${DORIS_USERNAME:root}
  password: ${DORIS_PASSWORD:}

# AI 归因默认关闭。endpoint 应配置为兼容 Chat Completions 的完整接口地址，密钥只通过环境变量提供。
ai:
  attribution:
    enabled: ${AI_ATTRIBUTION_ENABLED:false}
    endpoint: ${AI_ATTRIBUTION_ENDPOINT:}
    api-key: ${AI_ATTRIBUTION_API_KEY:}
    model: ${AI_ATTRIBUTION_MODEL:}
    fixed-delay-ms: ${AI_ATTRIBUTION_FIXED_DELAY_MS:60000}
    batch-size: ${AI_ATTRIBUTION_BATCH_SIZE:10}
    max-attempts: ${AI_ATTRIBUTION_MAX_ATTEMPTS:3}
    connect-timeout-ms: ${AI_ATTRIBUTION_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_ATTRIBUTION_READ_TIMEOUT_MS:30000}
    json-response-format-enabled: ${AI_ATTRIBUTION_JSON_RESPONSE_FORMAT_ENABLED:true}

# 日志配置
logging:
  level:
    org.example.realtime.view: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/realtime-view.log
